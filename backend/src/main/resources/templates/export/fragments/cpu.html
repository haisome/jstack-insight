<div th:fragment="cpu" xmlns:th="http://www.thymeleaf.org">
    <div class="card">
        <h2>CPU 线程推测</h2>

        <div class="stats">
            <div class="stat info">
                <div class="num" th:text="${cpu.total}"></div>
                <div class="label">RUNNABLE 总数</div>
            </div>
            <div class="stat" th:classappend="${cpu.cpuCount > 0 ? 'danger' : 'info'}">
                <div class="num" th:text="${cpu.cpuCount}"></div>
                <div class="label">疑似 CPU 消耗</div>
            </div>
            <div class="stat info">
                <div class="num" th:text="${cpu.ioCount}"></div>
                <div class="label">IO 等待</div>
            </div>
            <div class="stat info">
                <div class="num" th:text="${cpu.gcCount}"></div>
                <div class="label">GC 系统线程</div>
            </div>
        </div>

        <div class="alert alert-danger" th:if="${cpu.cpuCount > 0}">
            ⚠ 检测到 <span th:text="${cpu.cpuCount}"></span> 个疑似 CPU 消耗线程，建议进一步使用 top -H 进行精准采集
        </div>

        <table>
            <thead>
            <tr>
                <th>分类</th><th>线程名</th><th>评估理由</th><th>栈深</th><th>栈顶帧</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${cpu.results}"
                th:style="${'background:' + r.rowColor + ';' + (r.category != 'CPU_CONSUMING' ? 'opacity:0.6;' : '')}">
                <td style="white-space:nowrap;">
                    <span class="tag" th:style="${'background:' + r.catBg + ';color:#fff;'}" th:text="${r.catLabel}"></span>
                </td>
                <td><code style="font-size:12px;" th:text="${r.thread.name}"></code></td>
                <td style="font-size:12px;color:#666;">
                    <span th:each="reason, rs : ${r.reasons}">
                        <br th:if="${rs.index > 0}">
                        <span th:text="${'• ' + reason}"></span>
                    </span>
                </td>
                <td th:text="${r.stackDepth}"></td>
                <td style="font-family:monospace;font-size:11px;color:#1677ff;" th:text="${r.topFrame}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
