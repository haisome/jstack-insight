server:
  port: 9595
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: jstack-insight
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JStack Insight 自定义配置
jstack-insight:
  report:
    # 报告存储目录（相对于项目根目录）
    dir: jstackInsightData/reports
    # 报告默认有效期（小时）
    expire-hours: 24
    # 分享后延长至（小时）
    extend-hours: 48

# SpringDoc / Swagger UI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    UPLOAD_AUDIT: INFO
